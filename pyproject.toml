[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mjolnir-ml"
version = "0.1.0"
description = "Ω-certifiability harness: turn a fitted predictor (sklearn first) into a fail-closed decision model via @dsl policies."
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []
authors = [
    {name = "Eduardo Perez Denadai", email = "reach@optimality.ai"},
]
keywords = ["machine learning", "safe ai", "abstention", "certification", "conformal prediction"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
sklearn = ["scikit-learn>=1.3"]
examples = ["scikit-learn>=1.3", "numpy>=1.24", "pandas>=2.0",
            "phart>=2.1", "networkx>=3.3"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["mjolnir_ml*"]
exclude = ["tests*", "examples*", "workbooks*", "experiments*"]

[project.urls]
Homepage = "https://github.com/eduoptimal/mjolnir_ml"
Repository = "https://github.com/eduoptimal/mjolnir_ml"
"Commercial licensing" = "https://github.com/eduoptimal/mjolnir_ml#license-and-contact"
Contact = "https://github.com/eduoptimal/mjolnir_ml/issues"
