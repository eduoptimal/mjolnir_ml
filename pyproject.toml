[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mjolnir-ml"
version = "0.1.0"
description = "Ω-certifiability harness: turn a fitted predictor (sklearn first) into a fail-closed decision model via @dsl policies."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
sklearn = ["scikit-learn>=1.3"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["mjolnir_ml*"]
