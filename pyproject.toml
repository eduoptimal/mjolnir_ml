[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mjolnir-ml"
version = "0.1.0"
description = "Ω-certifiability harness: turn a fitted predictor (sklearn first) into a fail-closed decision model via @dsl policies."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
sklearn = ["scikit-learn>=1.3"]
test = ["pytest>=8"]
examples = ["scikit-learn>=1.3", "numpy>=1.24", "pandas>=2.0",
            "phart>=2.1", "networkx>=3.3"]

[tool.setuptools.packages.find]
include = ["mjolnir_ml*"]

[project.urls]
Homepage = "https://github.com/eduoptimal/mjolnir_ml"
Repository = "https://github.com/eduoptimal/mjolnir_ml"
"Commercial licensing" = "mailto:reach@optimality.ai"
Contact = "mailto:reach@optimality.ai"
